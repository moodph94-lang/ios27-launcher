name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          
      - name: Extract Android project
        run: |
          mkdir project
          unzip -q iOS27Launcher_Xiaomi11T_Project.zip -d project

      - name: Build APK
        run: |
          cd project
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iOS27-Launcher-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
